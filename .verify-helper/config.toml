[languages.cpp]
# 理由は docs/current/verify-workflow.md（oj-resolve の設定）を参照。
read_macros = false

[[languages.cpp.environments]]
CXX = "g++"
CXXFLAGS = [
    "-O2",
    "-Wall",
    "-Wextra",
    "-fconstexpr-depth=1024",
    "-fconstexpr-loop-limit=524288",
    "-fconstexpr-ops-limit=2097152",
    "-march=native",
    "-pthread",
    "-std=gnu++23",
    "-I./lib",
]
