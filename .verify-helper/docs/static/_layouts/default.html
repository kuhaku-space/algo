<!doctype html>
<html lang="{{ site.lang | default: "ja" }}">
  <head>{% include head.html %}</head>
  <body>
    <header class="topbar">
      <a class="topbar-title" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
      <div class="topbar-search">
        <input id="reference-search-input" type="search" autocomplete="off"
               placeholder="型・関数・ヘッダを検索  /" aria-label="リファレンスを検索">
        <ul id="reference-search-results" class="search-results" hidden></ul>
      </div>
      <a class="topbar-link" href="{{ site.repository_url }}">GitHub</a>
    </header>
    <div class="page">
      {% include sidebar.html %}
      <main class="content">
        {{ content }}
      </main>
    </div>
    <footer class="footer">
      <a href="{{ site.repository_url }}">{{ site.repository_url }}</a>
    </footer>
  </body>
</html>
