[coverage]
# ページはすべてヘッダの Doxygen コメントから生成する。ここで追跡するのは
# 「利用者向けの公開 API がどれだけ説明されているか」であり、実装詳細と
# 提出用テンプレートは対象外にする。
excluded_directories = ["internal", "template"]

# 現在値を下限として、説明の削除や未文書 API の増加を防ぐ。
minimum_documented_headers = 165
minimum_entity_pages = 342
minimum_documented_complexities = 1200
maximum_undocumented_entities = 0
