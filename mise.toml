# ツールの選定理由（pipx バックエンド・setuptools のピン・shim・タスクの dir 指定など）は
# docs/current/toolchain.md にまとめてある。

[tools]
clang-format = "latest"              # .githooks/pre-commit が使う
jq = "latest"
ruff = "latest"                      # 設定は ruff.toml
uv = "latest"                        # pipx バックエンドの実体
# 以下は pipx（実体は uv）で入れる Python CLI。
"pipx:git+https://github.com/kuhaku-space/daily-problems-cli.git" = "latest"  # daily
# oj / oj-bundle / oj-verify。setuptools<81 のピンは必須（理由はドキュメント参照）。
"pipx:online-judge-tools" = { version = "latest", uvx_args = "--with setuptools<81", pipx_args = "--preinstall setuptools<81" }
"pipx:online-judge-verify-helper" = { version = "latest", uvx_args = "--with setuptools<81", pipx_args = "--preinstall setuptools<81" }

# workspace/ でのコンパイルフラグ。PCH はこれと同じフラグでないと使われないので一箇所にまとめる。
[vars]
cxx_flags = "-DNOMINMAX -DONLINE_JUDGE -DOR_PROTO_DLL= -DPROTOBUF_USE_DLLS -DUSE_BOP -DUSE_CBC -DUSE_CLP -DUSE_GLOP -DUSE_LP_PARSER -DUSE_MATH_OPT -DUSE_PDLP -DUSE_SCIP -Wall -Wextra -fconstexpr-depth=1024 -fconstexpr-loop-limit=524288 -fconstexpr-ops-limit=2097152 -march=native -pthread -std=gnu++23 -fopenmp"
cxx_release_flags = "-O2 -ftrivial-auto-var-init=zero"

[tasks.lint]
description = "tools/ の Python を ruff で検査する"
run = "ruff check tools"

[tasks.docs]
description = "日本語リファレンスを docs/generated/ に生成する"
run = "python3 tools/reference_docs.py build"

[tasks.docs-check]
description = "日本語リファレンスを生成し、網羅率と例を検査する"
run = [
  "python3 tools/reference_docs.py check",
  "python3 -m unittest discover -s tools/tests -p 'test_*.py'",
]

[tasks.docs-site]
description = "検証結果なしでサイトのソースを _jekyll/ に組み立てる（見た目の確認用）"
run = [
  "python3 tools/reference_docs.py build",
  "python3 tools/render_reference_site.py --offline --destination _jekyll",
]

[tasks.setup]
description = "Setup project（ツール・oj-tools・shim を一括導入）"
run = [
  "mise install",
  # CLI でしか入らないシステムパッケージ。
  "which xclip > /dev/null || (sudo apt update -qq && sudo apt install -qq xclip)",
  "which g++-15 > /dev/null || (sudo apt update -qq && sudo apt install -qq g++-15)",
  "git config core.hooksPath .githooks",
  "mise run install-shims",
]

[tasks.install-shims]
description = "oj 系コマンドの shim を ~/.local/bin に生成（どこからでも ojb 等を実行可能に）"
run = """
#!/bin/bash
# `mise -C <repo> run <task>` を exec するだけの薄いラッパーを作る。
ROOT="{{config_root}}"
BIN="$HOME/.local/bin"
mkdir -p "$BIN"
case ":$PATH:" in
  *":$BIN:"*) ;;
  *) echo "警告: $BIN が PATH に含まれていません。ログインシェルの PATH に追加してください。" >&2 ;;
esac
for t in ojd ojn ojc ojg ojb ojt ojs ojtc ojrc; do
  printf '#!/bin/sh\\nexec mise -C "%s" run %s "$@"\\n' "$ROOT" "$t" > "$BIN/$t"
  chmod +x "$BIN/$t"
  echo "  installed: $BIN/$t -> mise run $t"
done
"""

[tasks.gen-tests]
description = "クリップボードのJSONから入出力例ファイルを生成する"
alias = "ojg"
dir = "{{config_root}}/workspace"
run = """
#!/bin/bash
if command -v xclip > /dev/null; then
  CONTENT=$(xclip -selection clipboard -o)
else
  echo "エラー: クリップボード取得コマンドが見つかりません (xclipをインストールしてください)"
  exit 1
fi
# JSONのバリデーション
if ! echo "$CONTENT" | jq empty 2>/dev/null; then
  echo "Error: Clipboard does not contain valid JSON."
  exit 1
fi

mkdir -p test
rm -f test/*

# JSONの配列の長さを取得してループ
length=$(echo "$CONTENT" | jq '. | length')

for ((i=0; i<$length; i++)); do
  num=$((i+1))
  echo "$CONTENT" | jq -r ".[$i].input" > "test/sample-${num}.in"
  echo "$CONTENT" | jq -r ".[$i].output" > "test/sample-${num}.out"
  echo "  - sample-${num}.in / sample-${num}.out を作成しました。"
done
"""

# ここから下は workspace/ で問題を解くための oj 系タスク（ライブラリ開発とは別系統）。
# 正名は動詞、短縮名（ojd/ojb/ojt/...）は alias で併設。命名・dir 指定・bundle/compile を
# インライン定義している理由は docs/current/toolchain.md を参照。

[tasks.download]
description = "workspace でテストケースをダウンロード（oj d、-a でシステムテスト）"
alias = "ojd"
dir = "{{config_root}}/workspace"
usage = '''
flag "-a --system" help="システムテスト（全テストケース）をダウンロードする"
arg "<url>" help="問題ページの URL" required=#true
'''
run = """
#!/bin/bash
oj_args=()
[[ "$usage_system" == "true" ]] && oj_args+=(-a)
rm -rf test/ && oj d "${oj_args[@]}" "$usage_url"
"""

[tasks.new]
description = "URL からテストを取得し a.cpp をテンプレートから用意（download + 雛形）"
alias = "ojn"
dir = "{{config_root}}/workspace"
usage = '''
arg "<url>" help="問題ページの URL" required=#true
'''
run = """
#!/bin/bash
# a.cpp は常にテンプレートで上書きする（テストだけ取り直すなら ojd）。
# 1. テンプレートから生成し、competitive-verifier の PROBLEM 行に URL を埋め込む。
# URL に sed のメタ文字が含まれても安全なよう awk で先頭の PROBLEM 行のみ追記する。
awk -v url="$usage_url" '
  !done && /^\\/\\/ competitive-verifier: PROBLEM/ { print $0 " " url; done=1; next }
  { print }
' template/template.cpp > a.cpp && echo "a.cpp をテンプレートから生成しました（PROBLEM に URL を埋め込み）。"

# 2. 既存 test/ を壊さないよう一時ディレクトリへ取得し、成功した場合だけ差し替える。
tmp_test=$(mktemp -d) || exit 1
trap 'rm -rf "$tmp_test"' EXIT
if ! oj d -d "$tmp_test" "$usage_url"; then
  echo "サンプルのダウンロードに失敗しました。test/ は変更していません。" >&2
  exit 1
fi

# 3. test/ の中身を変更する（既存を消して取得分で置き換える）。
rm -rf test/
mv "$tmp_test" test/
echo "test/ をダウンロードしたサンプルで更新しました。"
"""

[tasks.clean]
description = "生成物（main.cpp / a.out / test/）を掃除"
alias = "ojc"
dir = "{{config_root}}/workspace"
run = """
#!/bin/bash
rm -rf main.cpp a.out test/ checker/test/main.cpp checker/test/a.out
echo "クリーンアップしました。"
"""

[tasks.build]
description = "ソース（既定 a.cpp）を bundle して main.cpp をコンパイル（-g でサニタイザ）"
alias = "ojb"
dir = "{{config_root}}/workspace"
usage = '''
flag "-g --debug" help="サニタイザ付きデバッグビルド（ASan/UBSan + _GLIBCXX_DEBUG）"
arg "<src>" help="ソースファイル（省略時 a.cpp）" default="a.cpp"
'''
run = """
#!/bin/bash
LIB="{{config_root}}/lib"
PCH="{{config_root}}/workspace/.pch"
oj_bundle() {
  oj-bundle -I "$LIB" "$1" 2>/dev/null \\
    | grep -v "^#line " | grep -v "^#pragma once" | tr -s "\\n"
}
# bits/stdc++.h の include より前にある #pragma GCC optimize を同じ意味のフラグにする
# （GCC と同じく "O3" は -O3、"unroll-loops" は -funroll-loops と読む）。
pragma_flags() {
  local opts opt flags=()
  IFS=, read -ra opts < <(sed -n '/^#include <bits\\/stdc++\\.h>/q; s/^#pragma GCC optimize("\\(.*\\)")$/\\1/p' | paste -sd,)
  for opt in "${opts[@]}"; do
    case "$opt" in
      -*) flags+=("$opt") ;;
      O*) flags+=("-$opt") ;;
      *) flags+=("-f$opt") ;;
    esac
  done
  echo "${flags[*]}"
}
oj_compile() {
  # デバッグ時は最適化を外しサニタイザを足す。引数は最後に置き、-O を上書きできるようにする。
  local opt_args=({{vars.cxx_release_flags}})
  if [[ "$usage_debug" == "true" ]]; then
    opt_args=(-O1 -g -fsanitize=address,undefined -D_GLIBCXX_DEBUG)
  fi
  g++-15 {{vars.cxx_flags}} "${opt_args[@]}" -Wl,--as-needed "$@"
}
[[ -f "$usage_src" ]] || { echo "$usage_src が見つかりません" >&2; exit 1; }
oj_bundle "$usage_src" >main.cpp || exit 1
# include より前に optimize pragma があると PCH（mise run pch）は使われない。pragma のフラグが
# PCH 作成時と一致するときだけ、pragma を空行にして同じ意味のフラグで渡す。提出する main.cpp は
# 書き換えず、#line で診断のファイル名と行番号を main.cpp に揃える。
pch_flags=$(pragma_flags <main.cpp)
if [[ "$usage_debug" != "true" && -f "$PCH/bits/stdc++.h.gch" \\
      && "$pch_flags" == "$(cat "$PCH/flags" 2>/dev/null)" ]]; then
  read -ra pch_args <<<"$pch_flags"
  { echo '#line 1 "main.cpp"'; sed '/^#include <bits\\/stdc++\\.h>/,$!s/^#pragma GCC optimize(.*//' main.cpp; } \\
    | oj_compile -I "$PCH" -Winvalid-pch "${pch_args[@]}" -x c++ -
else
  oj_compile main.cpp
fi
"""

[tasks.pch]
description = "build を速くする bits/stdc++.h の PCH を workspace/.pch に作る（g++ やフラグを変えたら作り直す）"
dir = "{{config_root}}/workspace"
run = """
#!/bin/bash
LIB="{{config_root}}/lib"
PCH="{{config_root}}/workspace/.pch"
oj_bundle() {
  oj-bundle -I "$LIB" "$1" 2>/dev/null \\
    | grep -v "^#line " | grep -v "^#pragma once" | tr -s "\\n"
}
# bits/stdc++.h の include より前にある #pragma GCC optimize を同じ意味のフラグにする
# （GCC と同じく "O3" は -O3、"unroll-loops" は -funroll-loops と読む）。
pragma_flags() {
  local opts opt flags=()
  IFS=, read -ra opts < <(sed -n '/^#include <bits\\/stdc++\\.h>/q; s/^#pragma GCC optimize("\\(.*\\)")$/\\1/p' | paste -sd,)
  for opt in "${opts[@]}"; do
    case "$opt" in
      -*) flags+=("$opt") ;;
      O*) flags+=("-$opt") ;;
      *) flags+=("-f$opt") ;;
    esac
  done
  echo "${flags[*]}"
}
# テンプレートの optimize pragma と同じフラグで作る。build はフラグが一致するときだけ使う。
flags=$(oj_bundle template/template.cpp | pragma_flags)
read -ra flag_args <<<"$flags"
header=$(echo "#include <bits/stdc++.h>" | g++-15 -std=gnu++23 -x c++ -H -fsyntax-only - 2>&1 | awk 'NR == 1 { print $2 }')
[[ -f "$header" ]] || { echo "bits/stdc++.h が見つかりません" >&2; exit 1; }
rm -f "$PCH/flags"
# 元のヘッダも隣に置き、PCH が使えないときはそれが読まれるようにする。
mkdir -p "$PCH/bits" && cp "$header" "$PCH/bits/stdc++.h" || exit 1
g++-15 {{vars.cxx_flags}} {{vars.cxx_release_flags}} "${flag_args[@]}" \\
  -x c++-header "$PCH/bits/stdc++.h" -o "$PCH/bits/stdc++.h.gch" || exit 1
echo "$flags" >"$PCH/flags"
echo "PCH を作成しました: $PCH（optimize pragma 由来のフラグ: ${flags:-なし}）"
"""

[tasks.test]
description = "ソース（既定 a.cpp）を bundle・compile して oj t（-e で誤差ジャッジ）"
alias = "ojt"
dir = "{{config_root}}/workspace"
usage = '''
flag "-e --error" help="誤差ジャッジ（許容誤差 1e-9）を有効化"
arg "<src>" help="ソースファイル（省略時 a.cpp）" default="a.cpp"
'''
run = """
#!/bin/bash
mise run build "$usage_src" || exit 1

# 再帰の深い解法がローカルでだけ SIGSEGV しないようスタックを広げる（子に継承される）。
ulimit -s unlimited 2>/dev/null || ulimit -s 1048576

oj_args=(-N)
[[ "$usage_error" == "true" ]] && oj_args+=(-e 1e-9)
oj t "${oj_args[@]}"
"""

[tasks.submit]
description = "test 通過後に main.cpp を提出（-f でテスト省略、-y で確認省略）"
alias = "ojs"
dir = "{{config_root}}/workspace"
usage = '''
flag "-e --error" help="誤差ジャッジ（許容誤差 1e-9）でテスト"
flag "-f --force" help="提出前のローカルテストを省略する"
flag "-y --yes" help="確認プロンプトを省略する"
arg "<src>" help="ソースファイル（省略時 a.cpp）" default="a.cpp"
'''
run = """
#!/bin/bash
# 既定では提出前にローカルテストを走らせ、落ちたら止める（誤提出ガード）。
if [[ "$usage_force" == "true" ]]; then
  mise run build "$usage_src" || exit 1
else
  test_args=()
  [[ "$usage_error" == "true" ]] && test_args+=(-e)
  if ! mise run test "${test_args[@]}" "$usage_src"; then
    echo "ローカルテストが失敗しました。提出するには -f を付けてください。" >&2
    exit 1
  fi
fi

if [[ "$usage_yes" != "true" ]]; then
  read -r -p "$usage_src を提出しますか? [y/N] " ans
  [[ "$ans" == [yY] ]] || { echo "中止しました。"; exit 1; }
fi
oj s main.cpp
"""

[tasks.test-clip]
description = "test（既定 a.cpp）後に main.cpp をクリップボードへコピー"
alias = "ojtc"
dir = "{{config_root}}/workspace"
usage = '''
flag "-e --error" help="誤差ジャッジ（許容誤差 1e-9）を有効化"
arg "<src>" help="ソースファイル（省略時 a.cpp）" default="a.cpp"
'''
run = """
#!/bin/bash
test_args=()
[[ "$usage_error" == "true" ]] && test_args+=(-e)
mise run test "${test_args[@]}" "$usage_src" || exit 1
xclip -selection clipboard < main.cpp
"""

[tasks.random-check]
description = "ランダムチェッカー（解答（既定 a.cpp）と checker/test.cpp を回す）"
alias = "ojrc"
dir = "{{config_root}}/workspace"
usage = '''
arg "<src>" help="解答ソースファイル（省略時 a.cpp）" default="a.cpp"
'''
run = """
#!/bin/bash
LIB="{{config_root}}/lib"
oj_bundle() {
  oj-bundle -I "$LIB" "$1" 2>/dev/null \\
    | grep -v "^#line " | grep -v "^#pragma once" | tr -s "\\n"
}
oj_compile() {
  g++-15 {{vars.cxx_flags}} {{vars.cxx_release_flags}} -Wl,--as-needed "$1"
}
[[ -f "$usage_src" ]] || { echo "$usage_src が見つかりません" >&2; exit 1; }
oj_bundle "$usage_src" >main.cpp || exit 1
oj_compile main.cpp || exit 1
# 再帰の深い解法がローカルでだけ SIGSEGV しないようスタックを広げる（子に継承される）。
ulimit -s unlimited 2>/dev/null || ulimit -s 1048576
(
  cd checker || exit 1
  [[ -f test.cpp ]] || exit 1
  oj_bundle test.cpp >test/main.cpp || exit 1
  cd test || exit 1
  oj_compile main.cpp || exit 1
  ./a.out
)
"""
